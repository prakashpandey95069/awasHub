<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AwasHub - Advanced Real Estate Intelligence</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-glow: rgba(6, 182, 212, 0.2);
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            max-width: 1120px;
            width: 95%;
            margin: 20px;
            overflow: hidden;
            flex-wrap: wrap;
        }

        /* --- Left Side: Input Panel --- */
        .control-panel {
            flex: 1.1;
            padding: 45px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
            min-width: 320px;
        }

        .brand-header {
            margin-bottom: 35px;
        }

        .brand-header h1 {
            font-size: 30px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-emerald));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 5px 0 0 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .form-grid .full-width {
            grid-column: span 2;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .input-box input {
            background-color: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-box input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            background-color: #1a2236;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit {
            flex: 2;
            background: linear-gradient(135deg, var(--accent-cyan), #0891b2);
            color: #ffffff;
            min-width: 140px;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }

        .btn-util {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-util:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- Right Side: Dashboard Screen --- */
        .analytics-panel {
            flex: 0.9;
            background: rgba(15, 23, 42, 0.3);
            padding: 45px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 320px;
            position: relative;
        }

        .state-container {
            text-align: center;
            width: 100%;
        }

        .empty-icon {
            font-size: 55px;
            color: rgba(6, 182, 212, 0.2);
            margin-bottom: 20px;
        }

        .analytics-panel h3 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.3px;
        }

        .analytics-panel p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        /* Glow Card UI for dynamic result */
        .result-glow-box {
            display: none;
            width: 100%;
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed rgba(6, 182, 212, 0.4);
            border-radius: 16px;
            padding: 30px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease forwards;
        }

        .valuation-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .valuation-price {
            font-size: 42px;
            font-weight: 900;
            color: #10b981;
            letter-spacing: -1.5px;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .valuation-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-emerald);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Loader */
        .intelligence-loader {
            display: none;
            text-align: center;
        }

        .quantum-spinner {
            border: 3px solid rgba(6, 182, 212, 0.1);
            border-top: 3px solid var(--accent-cyan);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- Custom Footer --- */
        .system-meta {
            position: absolute;
            bottom: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            font-family: monospace;
        }

        /* Media Queries for full responsiveness */
        @media (max-width: 868px) {
            .dashboard-container {
                flex-direction: column;
            }
            .control-panel {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                padding: 35px 25px;
            }
            .analytics-panel {
                padding: 40px 25px;
                min-height: 300px;
            }
            .system-meta {
                position: static;
                margin-top: 30px;
            }
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-grid .full-width {
                grid-column: span 1;
            }
            .button-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="control-panel">
        <div class="brand-header">
            <h1>AwasHub Pro</h1>
            <p>Predictive Real Estate Intelligence Engine</p>
        </div>
        
        <form id="predictionForm">
            <div class="form-grid">
                <div class="input-box full-width">
                    <label for="area">Carpet Area (Sq. Ft.)</label>
                    <input type="number" id="area" placeholder="e.g. 1500" required min="100" max="10000">
                </div>

                <div class="input-box">
                    <label for="bedrooms">Bedrooms (BHK)</label>
                    <input type="number" id="bedrooms" placeholder="e.g. 3" required min="1" max="10">
                </div>

                <div class="input-box">
                    <label for="bathrooms">Bathrooms</label>
                    <input type="number" id="bathrooms" placeholder="e.g. 2" required min="1" max="10">
                </div>

                <div class="input-box">
                    <label for="stories">Stories</label>
                    <input type="number" id="stories" placeholder="e.g. 2" required min="1" max="5">
                </div>

                <div class="input-box">
                    <label for="parking">Parking</label>
                    <input type="number" id="parking" placeholder="e.g. 1" required min="0" max="5">
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-submit" id="predictBtn">Execute Prediction</button>
                <button type="button" class="btn btn-util" onclick="loadSampleData()">Sample</button>
                <button type="button" class="btn btn-util" onclick="clearForm()">Clear</button>
            </div>
        </form>
    </div>

    <div class="analytics-panel">
        <div class="state-container" id="emptyState">
            <div class="empty-icon">⌘</div>
            <h3>Engine Idle</h3>
            <p>Input data and submit query to process evaluation</p>
        </div>

        <div class="intelligence-loader" id="loadingState">
            <div class="quantum-spinner"></div>
            <p style="color: var(--accent-cyan); font-weight: 500;">Running Inference Model...</p>
        </div>

        <div class="result-glow-box" id="resultState">
            <div class="valuation-label">AI System Appraisal</div>
            <div class="valuation-price" id="finalPriceDisplay">₹ 0.00 Lakhs</div>
            <div class="valuation-badge">Predictive Accuracy Applied</div>
        </div>


    </div>
</div>

<script>
    const form = document.getElementById("predictionForm");
    const emptyState = document.getElementById("emptyState");
    const loadingState = document.getElementById("loadingState");
    const resultState = document.getElementById("resultState");
    const finalPriceDisplay = document.getElementById("finalPriceDisplay");
    const predictBtn = document.getElementById("predictBtn");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Prepare Interface
        emptyState.style.display = "none";
        resultState.style.display = "none";
        loadingState.style.display = "block";
        predictBtn.innerText = "Processing...";
        predictBtn.disabled = true;

        const propertyData = {
            area: parseFloat(document.getElementById("area").value),
            bedrooms: parseInt(document.getElementById("bedrooms").value),
            bathrooms: parseInt(document.getElementById("bathrooms").value),
            stories: parseInt(document.getElementById("stories").value),
            parking: parseInt(document.getElementById("parking").value)
        };

        try {
            const response = await fetch('http://127.0.0.1:5000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(propertyData)
            });

            await new Promise(resolve => setTimeout(resolve, 800));
            const result = await response.json();

            loadingState.style.display = "none";

            if (response.ok && result.price) {
                resultState.style.display = "block";
                finalPriceDisplay.innerText = `₹ ${result.price} Lakhs`;
            } else {
                emptyState.style.display = "block";
                alert("Model Inference Failed: " + (result.error || "Unknown Error"));
            }
        } catch (error) {
            loadingState.style.display = "none";
            emptyState.style.display = "block";
            alert("Backend Bridge Disconnected. Ensure Node server is active.");
        } finally {
            predictBtn.innerText = "Execute Prediction";
            predictBtn.disabled = false;
        }
    });

    function loadSampleData() {
        document.getElementById("area").value = 1850;
        document.getElementById("bedrooms").value = 3;
        document.getElementById("bathrooms").value = 2;
        document.getElementById("stories").value = 2;
        document.getElementById("parking").value = 1;
        clearForm(false);
    }

    function clearForm(resetInputs = true) {
        if(resetInputs) form.reset();
        loadingState.style.display = "none";
        resultState.style.display = "none";
        emptyState.style.display = "block";
        predictBtn.innerText = "Execute Prediction";
        predictBtn.disabled = false;
    }
</script>

</body>
</html>
